name: Latest blog post

on: 
  repository_dispatch: 
    types: [special_repository]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit and push the README update
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: "git config"
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://shenxianpeng.dev/index.xml"
          max_post_count: 3
          date_format: mmm d, yyyy
          template: "$newline- [$title]($url) - $date"
